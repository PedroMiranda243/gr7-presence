# Atualizações de dependências uma vez por mês, agrupadas: um PR por ecossistema, revisado como
# qualquer outro (a CI roda os testes no Windows antes do merge).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
